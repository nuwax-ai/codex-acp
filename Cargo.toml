[package]
name = "nuwax-codex-acp"
version = "0.16.0"
edition = "2024"
authors = ["soddygo <soddygo@qq.com>", "Zed <hi@zed.dev>"]
license = "Apache-2.0"
description = "An ACP-compatible coding agent powered by Codex, with domestic (Chinese) LLM support"
repository = "https://github.com/nuwax-ai/codex-acp"
homepage = "https://github.com/nuwax-ai/codex-acp"

[[bin]]
name = "nuwax-codex-acp"
path = "src/main.rs"

[lib]
doctest = false
name = "nuwax_codex_acp"
path = "src/lib.rs"

[dependencies]
agent-client-protocol = { version = "=0.14.0", features = ["unstable"] }
anyhow = "1"
clap = "4"
codex-apply-patch = { git = "https://github.com/nuwax-ai/codex.git", tag = "codex-1.0.8", subdirectory = "codex-rs/apply-patch" }
codex-arg0 = { git = "https://github.com/nuwax-ai/codex.git", tag = "codex-1.0.8", subdirectory = "codex-rs/arg0" }
codex-config = { git = "https://github.com/nuwax-ai/codex.git", tag = "codex-1.0.8", subdirectory = "codex-rs/config" }
codex-core = { git = "https://github.com/nuwax-ai/codex.git", tag = "codex-1.0.8", subdirectory = "codex-rs/core", features = ["rust-genai"] }
codex-features = { git = "https://github.com/nuwax-ai/codex.git", tag = "codex-1.0.8", subdirectory = "codex-rs/features" }
codex-model-provider-info = { git = "https://github.com/nuwax-ai/codex.git", tag = "codex-1.0.8", subdirectory = "codex-rs/model-provider-info" }
codex-exec-server = { git = "https://github.com/nuwax-ai/codex.git", tag = "codex-1.0.8", subdirectory = "codex-rs/exec-server" }
codex-extension-api = { git = "https://github.com/nuwax-ai/codex.git", tag = "codex-1.0.8", subdirectory = "codex-rs/ext/extension-api" }
codex-mcp-server = { git = "https://github.com/nuwax-ai/codex.git", tag = "codex-1.0.8", subdirectory = "codex-rs/mcp-server" }
codex-models-manager = { git = "https://github.com/nuwax-ai/codex.git", tag = "codex-1.0.8", subdirectory = "codex-rs/models-manager" }
codex-protocol = { git = "https://github.com/nuwax-ai/codex.git", tag = "codex-1.0.8", subdirectory = "codex-rs/protocol" }
codex-login = { git = "https://github.com/nuwax-ai/codex.git", tag = "codex-1.0.8", subdirectory = "codex-rs/login" }
codex-shell-command = { git = "https://github.com/nuwax-ai/codex.git", tag = "codex-1.0.8", subdirectory = "codex-rs/shell-command" }
codex-thread-store = { git = "https://github.com/nuwax-ai/codex.git", tag = "codex-1.0.8", subdirectory = "codex-rs/thread-store" }
codex-utils-approval-presets = { git = "https://github.com/nuwax-ai/codex.git", tag = "codex-1.0.8", subdirectory = "codex-rs/utils/approval-presets" }
codex-utils-cli = { git = "https://github.com/nuwax-ai/codex.git", tag = "codex-1.0.8", subdirectory = "codex-rs/utils/cli" }
codex-utils-path-uri = { git = "https://github.com/nuwax-ai/codex.git", tag = "codex-1.0.8", subdirectory = "codex-rs/utils/path-uri" }
diffy = { version = "0.5.0", features = ["std"] }
itertools = "0.14.0"
serde = { version = "1", features = ["derive"] }
# codex-cli depends on codex-tui, which enables serde_json/preserve_order; match
# that behavior here because it affects MCP keychain account hashing.
serde_json = { version = "1", features = ["preserve_order"] }
shlex = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util"] }
tokio-util = { version = "0.7", features = ["compat"] }
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
tracing-appender = "0.2"
heck = "0.5.0"
unicode-segmentation = "1.11.0"
uuid = { version = "1", features = ["v4"] }

[lints.rust]
let-underscore = "warn"
rust-2018-idioms = "warn"
unused = "warn"

[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "132f5b39c862e3a970f731d709608b3e6276d5f6" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "9200079d3b54a1ff51072e24d81fd354f085156f" }

[patch."https://github.com/nuwax-ai/codex.git"]
codex-utils-pty = { path = "vendor/codex-utils-pty" }

[dev-dependencies]
dirs = "6"
